<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación en Mantenimiento</title>
    <!-- FontAwesome para el ícono de mantenimiento -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Variables de color base (adapta si ya usas otras) */
        :root {
            --primary-color: #1e293b;
            --warning-color: #f59e0b;
        }

        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* CSS DE LA PANTALLA DE MANTENIMIENTO */
        #maintenance-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--primary-color);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100000; /* Asegura quedar por encima de modales, splash y menús */
            text-align: center;
            padding: 20px;
        }

        #maintenance-screen i {
            font-size: 64px;
            color: var(--warning-color);
            margin-bottom: 20px;
        }

        #maintenance-screen h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        #maintenance-screen p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.85);
            max-width: 400px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE MANTENIMIENTO -->
    <div id="maintenance-screen">
        <i class="fas fa-tools"></i>
        <h1>SISTEMA EN MANTENIMIENTO</h1>
        <p>Estamos realizando mejoras en la aplicación. Por favor, vuelve a intentarlo más tarde.</p>
    </div>

    <!-- EL RESTO DE TU APLICACIÓN/PWA PERMANECE ABAJO -->
    <div id="app">
        <!-- Contenido principal de tu sitio web -->
    </div>

</body>
</html>
